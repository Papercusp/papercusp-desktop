# Private GCS is mounted at /srv/releases. Cloud Run limits non-streamed
# HTTP/1 responses to 32 MiB. Stream larger files and keep Content-Length for
# smaller responses so the video player can seek with byte-range requests.
# See https://cloud.google.com/run/quotas.
server {
    listen 8080;
    server_name _;
    root /srv/releases;
    autoindex off;
    sendfile off;
    header_filter_by_lua_block {
        local content_length = tonumber(ngx.header.content_length)
        if content_length and content_length > 32 * 1024 * 1024 then
            ngx.header.content_length = nil
        end
    }
    location = /google-release-host.conf { return 404; }
    location / { try_files $uri $uri/ =404; }
}
