# Private GCS is mounted at /srv/releases. The outer server removes the known
# Content-Length and streams the unchanged bytes: Cloud Run limits non-streamed
# HTTP/1 responses to 32 MiB. See https://cloud.google.com/run/quotas.
server {
    listen 8081;
    server_name _;
    root /srv/releases;
    autoindex off;
    location = /google-release-host.conf { return 404; }
    location / { try_files $uri $uri/ =404; }
}

server {
    listen 8080;
    server_name _;
    location / {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_hide_header Content-Length;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }
}
