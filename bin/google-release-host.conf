# Private GCS is mounted at /srv/releases. OpenResty's header filter removes
# Content-Length and streams the unchanged bytes: Cloud Run limits non-streamed
# HTTP/1 responses to 32 MiB. See https://cloud.google.com/run/quotas.
server {
    listen 8080;
    server_name _;
    root /srv/releases;
    autoindex off;
    sendfile off;
    header_filter_by_lua_block {
        ngx.header.content_length = nil
    }
    location = /google-release-host.conf { return 404; }
    location / { try_files $uri $uri/ =404; }
}
