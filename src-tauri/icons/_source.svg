<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Background — soft gradient, rounded corners (transparent border via no rect) -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f1217"/>
      <stop offset="1" stop-color="#1a1f29"/>
    </linearGradient>
    <linearGradient id="cup" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff8e8"/>
      <stop offset="1" stop-color="#f4d4a3"/>
    </linearGradient>
    <linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6f4220"/>
      <stop offset="1" stop-color="#3a2418"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" ry="96" fill="url(#bg)"/>

  <!-- Steam strokes -->
  <path d="M 192 96 q -24 -24 0 -48" stroke="#a8b0bf" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.55"/>
  <path d="M 256 88 q 24 -32 0 -56" stroke="#a8b0bf" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.55"/>
  <path d="M 320 96 q -24 -24 0 -48" stroke="#a8b0bf" stroke-width="14" fill="none" stroke-linecap="round" opacity="0.55"/>

  <!-- Cup body -->
  <path d="M 120 176 L 152 432 Q 152 464 256 464 Q 360 464 360 432 L 392 176 Z"
        fill="url(#cup)" stroke="#3a2418" stroke-width="14" stroke-linejoin="round"/>

  <!-- Cup rim oval -->
  <ellipse cx="256" cy="176" rx="136" ry="28" fill="#fff5e1" stroke="#3a2418" stroke-width="14"/>

  <!-- Coffee surface -->
  <ellipse cx="256" cy="176" rx="113" ry="20" fill="url(#coffee)"/>

  <!-- Subtle "S" mark on the cup body — papercu(s)p framework -->
  <path d="M 232 296 q -28 0 -28 24 q 0 18 28 24 q 28 6 28 24 q 0 24 -28 24"
        stroke="#3a2418" stroke-width="14" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
</svg>
