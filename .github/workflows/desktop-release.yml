name: Desktop release
# Builds Papercusp desktop installers for macOS, Windows, and Linux
# whenever a `desktop-vX.Y.Z` tag is pushed. Outputs land on the GitHub
# Release matching the tag.
#
# Currently UNSIGNED on all platforms — users see Gatekeeper / SmartScreen
# warnings on first launch.
#
# Cost-shape:
#   - Real releases (`desktop-v1.2.3`): full 4-platform matrix incl. macOS-universal
#   - Test/iteration tags (`desktop-v*-test*`): NOT auto-triggered (see ! pattern)
#
# Multi-repo layout (post phase-c split):
#   - This repo: papercupai/papercusp-desktop  (src-tauri/, web/, bin/)
#   - Cloned sibling: papercupai/papercup      (apps/operator/ — UI source)
#   - Cloned sibling: papercupai/papercusp     (packages/papercusp-mcp-server,
#                                               packages/pglite-server,
#                                               packages/harness, libs/db/sql)
#
# bin/build-desktop-sidecar.sh expects PAPERCUP_ROOT + PAPERCUSP_ROOT env vars
# pointing at the sibling clones.

on:
  push:
    tags:
      - 'desktop-v*'
      - '!desktop-v*-test*'
  workflow_dispatch:
    inputs:
      macos_mode:
        description: 'macOS build (universal/arm-only/skip)'
        required: false
        default: 'arm-only'
        type: choice
        options:
          - universal
          - arm-only
          - skip

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            label: 'macOS (universal)'
          - platform: 'windows-latest'
            args: ''
            label: 'Windows (x86_64)'
          - platform: 'ubuntu-22.04'
            args: ''
            label: 'Linux (x86_64)'
          - platform: 'ubuntu-22.04-arm'
            args: '--target aarch64-unknown-linux-gnu'
            label: 'Linux (arm64)'

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}
    # NOTE: GitHub Actions does NOT allow `matrix` in job-level `if:`
    # expressions (only `github`, `vars`, `env`, `inputs`, `needs`, `secrets`),
    # so the previous `if:` gate that filtered macOS by inputs.macos_mode was
    # itself the cause of every workflow_dispatch / push run failing at
    # workflow-validation time (HTTP 422 "Unrecognized named-value: 'matrix'").
    # macos_mode='arm-only' is still respected at step level via the `args`
    # / `targets` expressions on the tauri-action step. macos_mode='skip' is
    # currently a no-op — the macOS runner always boots when the workflow
    # is dispatched. Re-introduce skip semantics if cost becomes a concern.
    steps:
      - name: Checkout papercusp-desktop (this repo)
        uses: actions/checkout@v4

      # Cross-repo checkouts use SIBLING_REPO_PAT — a fine-grained PAT with
      # Contents:read on papercupai/papercup + papercupai/papercusp. The
      # default secrets.GITHUB_TOKEN is scoped to the current repo only and
      # 404s on private siblings.
      - name: Checkout papercupai/papercup (sibling for apps/operator UI source)
        uses: actions/checkout@v4
        with:
          repository: papercupai/papercup
          path: _external/papercup
          token: ${{ secrets.SIBLING_REPO_PAT }}
          # papercup pulls in libs/papercup-db, libs/papergrid, libs/agent-chat,
          # libs/git-graph, libs/papercup-shared, libs/ui-primitives,
          # libs/papercusp, and libs/zero-harness as submodules. They're npm
          # workspace members; if missing, `npm install` 404s on
          # @restart/papercup-db etc. SIBLING_REPO_PAT must have Contents:read
          # on every submodule repo (broaden to org-wide if a new one is added).
          submodules: recursive

      - name: Checkout papercupai/papercusp (sibling for harness + mcp + pglite)
        uses: actions/checkout@v4
        with:
          repository: papercupai/papercusp
          path: _external/papercusp
          token: ${{ secrets.SIBLING_REPO_PAT }}

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # No cache: this repo has no package-lock.json, and the sibling
          # papercusp repo doesn't either. Re-introduce npm caching keyed on
          # _external/papercup/package-lock.json once a green build exists.

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && (github.event_name == 'workflow_dispatch' && inputs.macos_mode == 'arm-only' && 'aarch64-apple-darwin' || 'aarch64-apple-darwin,x86_64-apple-darwin') || '' }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          # Include matrix.platform in the key. runner.os is "Linux" for both
          # ubuntu-22.04 (x86_64) and ubuntu-22.04-arm (arm64), so the previous
          # key let an arm cache restore onto an x86_64 runner — cargo then
          # tried to exec an arm binary out of ~/.cargo/bin and failed with
          # ENOEXEC ("Exec format error (os error 8)") in `cargo metadata`,
          # killing the entire Linux x86_64 build.
          key: ${{ matrix.platform }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Linux build deps
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            rpm \
            libfuse2 \
            fuse \
            postgresql-client \
            postgresql-18-pgvector
          # postgresql-client: build-desktop-sidecar.sh symlinks pg_dump/psql/
          # pg_dumpall into the bundled sidecar (embedded-postgres ships
          # server-only). Both ubuntu-22.04 and ubuntu-22.04-arm need this —
          # neither image pre-installs it.
          # libfuse2 + fuse: linuxdeploy/AppImage runtime needs FUSE 2.
          # Ubuntu 22.04 ships FUSE 3 by default, so without libfuse2 the
          # AppImage bundling step fails with `failed to run linuxdeploy`
          # ~15s after starting. AppImage is the Tauri updater target on
          # Linux, so we cannot just drop it.

      # build-desktop-sidecar.sh hard-fails if pg_dump/psql/pg_dumpall aren't on
       # PATH. Embedded-postgres ships server-only — client tools come from the
       # build host. Ubuntu runners pre-install postgresql-client; macOS does
       # not. Windows uses chocolatey's postgres which lands them in PATH.
      - name: macOS PG client tools (pg_dump / psql) + pgvector
        if: startsWith(matrix.platform, 'macos')
        run: |
          brew install libpq
          BREW_PREFIX=$(brew --prefix libpq)
          echo "$BREW_PREFIX/bin" >> $GITHUB_PATH
          # pgvector is bundled into the embedded-postgres tree by
          # build-desktop-sidecar.sh so mem0 has a persistent vector
          # store. Without postgresql@18 + pgvector here, the bundle
          # ships without vector.dylib and mem0 falls back to its
          # volatile in-memory provider.
          brew install postgresql@18 pgvector || true

      - name: Windows pgvector build (from source against PG 18)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          # Build pgvector.dll against PostgreSQL 18 so mem0 gets a
          # persistent vector store on Windows. Without this, the
          # desktop bundle ships no vector.dll and mem0 falls back to
          # its in-process memory provider (volatile across restarts).
          #
          # Chocolatey ships postgresql18 with the dev headers we need.
          # Build with MSVC + nmake using pgvector's stock Makefile.win.
          # Output is consumed by bin/build-desktop-sidecar.sh which
          # checks PGVECTOR_WIN_DIR for the artifact set.
          $ErrorActionPreference = 'Continue'
          choco install -y postgresql18 --params '/Password:postgres /Port:54318' 2>$null
          if (-not (Test-Path 'C:\Program Files\PostgreSQL\18')) {
            Write-Host "::warning::PostgreSQL 18 not installed by choco; skipping Windows pgvector build (in-memory fallback ships)"
            exit 0
          }
          $env:PGROOT = 'C:\Program Files\PostgreSQL\18'
          git clone --depth 1 --branch v0.8.0 https://github.com/pgvector/pgvector.git $env:RUNNER_TEMP\pgvector
          Push-Location $env:RUNNER_TEMP\pgvector
          # Find the VS 2022 dev shell + run nmake. If anything fails,
          # log + continue (Windows users get in-memory fallback, build
          # itself doesn't abort).
          try {
            $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
            $vsPath = & $vswhere -latest -property installationPath
            $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
            cmd /c "`"$vcvars`" && nmake /F Makefile.win" 2>&1 | Tee-Object pgvector-build.log
            if (-not (Test-Path .\vector.dll)) {
              Write-Host "::warning::pgvector vector.dll not produced; build log: $(Get-Content pgvector-build.log -Raw)"
              exit 0
            }
            $outDir = Join-Path $env:GITHUB_WORKSPACE 'pgvector-win'
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null
            Copy-Item vector.dll $outDir\
            Copy-Item sql\vector--*.sql $outDir\
            Copy-Item vector.control $outDir\
            "PGVECTOR_WIN_DIR=$outDir" | Out-File -FilePath $env:GITHUB_ENV -Append
            Write-Host "✓ pgvector built; staged in $outDir for build-desktop-sidecar.sh"
          } catch {
            Write-Host "::warning::pgvector build failed: $_"
          } finally {
            Pop-Location
          }

      - name: Install workspace deps (this repo)
        run: npm install --legacy-peer-deps

      - name: Install papercup operator deps
        working-directory: _external/papercup
        run: npm install --legacy-peer-deps

      # No workspace-root install of papercusp: its `apps/*` workspaces
      # (apps/web, apps/desktop) reference @restart/* packages that live
      # in the *papercup* repo as submodules and aren't reachable from
      # this checkout. The desktop build only needs source files from
      # `packages/harness`, `packages/pglite-server`, and
      # `packages/papercusp-mcp-server`; bin/build-desktop-sidecar.sh
      # does targeted installs into the bundled output dirs after copy.

      - name: Build sidecar (Next.js standalone via build-desktop-sidecar.sh)
        env:
          PAPERCUP_ROOT: ${{ github.workspace }}/_external/papercup
          PAPERCUSP_ROOT: ${{ github.workspace }}/_external/papercusp
          # validateMemoryMapAttributions() walks getKnownRoles() at module-init
          # of apps/operator/app/api/_hono/harness.ts (Next.js page-data collection).
          # Without this env it falls back to ~/autonomous-harness which doesn't
          # exist on the runner, validRoles collapses to ['orchestrator'], and
          # every MEMORY_MAP attribution that isn't 'orchestrator' fails the build.
          PAPERCUSP_HARNESS_DIR: ${{ github.workspace }}/_external/papercusp/packages/harness
        run: bash bin/build-desktop-sidecar.sh

      - name: Build + bundle desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tell linuxdeploy + its plugins (which are themselves AppImages)
          # to self-extract instead of relying on FUSE. Adding libfuse2 to
          # apt was insufficient on the GitHub-hosted ubuntu-22.04 image —
          # /dev/fuse isn't available to the runner user. APPIMAGE_EXTRACT_AND_RUN=1
          # is the canonical CI workaround. No effect on macOS/Windows
          # builds; harmless to set unconditionally.
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # Tauri updater minisign signing. Without these, tauri-action skips
          # the per-platform signature + the latest.json manifest, and the
          # in-app updater errors with "no_compatible_assets". Generate a
          # keypair with `npx @tauri-apps/cli signer generate` and set:
          #   TAURI_SIGNING_PRIVATE_KEY            (the base64 private key)
          #   TAURI_SIGNING_PRIVATE_KEY_PASSWORD   (empty if you generated
          #                                         with -p "")
          # The matching public key lives in tauri.conf.json under
          # plugins.updater.pubkey and ships in the bundle.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # No projectPath — src-tauri/ lives at repo root in this multi-repo layout.
          tagName: ${{ github.ref_name }}
          releaseName: 'Papercusp Desktop ${{ github.ref_name }}'
          releaseBody: |
            Auto-built from ${{ github.sha }}.
            Unsigned — see install instructions in the description.
          releaseDraft: true
          prerelease: false
          args: ${{ (matrix.platform == 'macos-latest' && github.event_name == 'workflow_dispatch' && inputs.macos_mode == 'arm-only') && '--target aarch64-apple-darwin' || matrix.args }}

      # Linux post-build smoke: install the .deb, launch the binary briefly
      # under xvfb, confirm sidecar comes up. Skips ARM64 because we can't
      # run aarch64 binaries on the x86 runner.
      - name: Linux post-build smoke
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -e
          DEB=$(find src-tauri/target/release/bundle/deb -name 'Papercusp_*_amd64.deb' | head -1)
          if [[ -z "$DEB" ]]; then
            echo "ERROR: no .deb produced; nothing to smoke-test"
            exit 1
          fi
          echo "→ smoke-testing $DEB"
          sudo apt-get install -y "$DEB" || sudo dpkg -i "$DEB" || true
          sudo apt-get install -y -f
          sudo apt-get install -y xvfb curl

          xvfb-run -a /usr/bin/papercusp-desktop > /tmp/papercusp.log 2>&1 &
          PID=$!
          for i in {1..180}; do
            if grep -q "sidecar ready on :" /tmp/papercusp.log 2>/dev/null; then
              break
            fi
            sleep 0.5
          done
          if ! grep -q "sidecar ready on :" /tmp/papercusp.log; then
            echo "✗ Sidecar did not become ready in 90s. Full log:"
            cat /tmp/papercusp.log
            echo "---"
            echo "papercusp dirs in HOME:"
            ls -la $HOME/.papercusp/ 2>&1 || true
            kill $PID 2>/dev/null || true
            exit 1
          fi
          PORT=$(grep -oE 'sidecar ready on :[0-9]+' /tmp/papercusp.log | grep -oE '[0-9]+' | head -1)
          echo "✓ Sidecar reachable on port $PORT"

          if ! curl -sfm 5 "http://localhost:$PORT/api/desktop/preflight" | head -c 1000 | tee /tmp/preflight.json; then
            echo
            echo "✗ Preflight endpoint did not respond"
            tail -50 /tmp/papercusp.log
            kill $PID 2>/dev/null || true
            exit 1
          fi
          echo
          if ! grep -q '"ok"' /tmp/preflight.json; then
            echo "✗ Preflight response missing 'ok' field"
            cat /tmp/preflight.json
            kill $PID 2>/dev/null || true
            exit 1
          fi
          echo "✓ Preflight responds with valid JSON"

          # Force the Hono catch-all (/api/[[...route]]) to load by hitting
          # an endpoint it serves. Preflight + /api/installed are both
          # file-based routes that dodge any module-load failure in the
          # catch-all. Next.js loads route handlers lazily, so without a
          # request that targets the catch-all, its module-load errors
          # (missing pty.node, ERR_INVALID_URL, etc.) never trigger and
          # the smoke-grep below sees a clean log.
          # We don't care about the response — even a 4xx/5xx exercises
          # module load. Use a known-nonexistent path that won't 200 in
          # any plausible state, just to be unambiguous.
          curl -sfm 5 "http://localhost:$PORT/api/__smoke_force_module_load" || true
          # Give Next.js a moment to log if it's about to.
          sleep 1
          if grep -E "Failed to load native module|ERR_INVALID_URL|Cannot find module|MODULE_NOT_FOUND" /tmp/papercusp.log; then
            echo "✗ Sidecar logged a module-load failure — see above"
            tail -100 /tmp/papercusp.log
            kill $PID 2>/dev/null || true
            exit 1
          fi
          echo "✓ No module-load errors in sidecar log after catch-all probe"
          kill $PID 2>/dev/null || true
          echo "✓ Linux post-build smoke passed"
