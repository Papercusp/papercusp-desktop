name: Desktop release
# Builds Papercusp desktop installers for macOS, Windows, and Linux
# whenever a `desktop-vX.Y.Z` tag is pushed. Outputs land on the GitHub
# Release matching the tag.
#
# Currently UNSIGNED on all platforms — users see Gatekeeper / SmartScreen
# warnings on first launch.
#
# Cost-shape:
#   - Real releases (`desktop-v1.2.3`): full 4-platform matrix incl. macOS-universal
#   - Test/iteration tags (`desktop-v*-test*`): NOT auto-triggered (see ! pattern)
#
# Multi-repo layout (post phase-c split):
#   - This repo: papercupai/papercusp-desktop  (src-tauri/, web/, bin/)
#   - Cloned sibling: papercupai/papercup      (apps/operator/ — UI source)
#   - Cloned sibling: papercupai/papercusp     (packages/papercusp-mcp-server,
#                                               packages/pglite-server,
#                                               packages/harness, libs/db/sql)
#
# bin/build-desktop-sidecar.sh expects PAPERCUP_ROOT + PAPERCUSP_ROOT env vars
# pointing at the sibling clones.

on:
  push:
    tags:
      - 'desktop-v*'
      - '!desktop-v*-test*'
  workflow_dispatch:
    inputs:
      macos_mode:
        description: 'macOS build (universal/arm-only/skip)'
        required: false
        default: 'arm-only'
        type: choice
        options:
          - universal
          - arm-only
          - skip

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
            label: 'macOS (universal)'
          - platform: 'windows-latest'
            args: ''
            label: 'Windows (x86_64)'
          - platform: 'ubuntu-22.04'
            args: ''
            label: 'Linux (x86_64)'
          - platform: 'ubuntu-22.04-arm'
            args: '--target aarch64-unknown-linux-gnu'
            label: 'Linux (arm64)'

    runs-on: ${{ matrix.platform }}
    name: ${{ matrix.label }}
    # NOTE: GitHub Actions does NOT allow `matrix` in job-level `if:`
    # expressions (only `github`, `vars`, `env`, `inputs`, `needs`, `secrets`),
    # so the previous `if:` gate that filtered macOS by inputs.macos_mode was
    # itself the cause of every workflow_dispatch / push run failing at
    # workflow-validation time (HTTP 422 "Unrecognized named-value: 'matrix'").
    # macos_mode='arm-only' is still respected at step level via the `args`
    # / `targets` expressions on the tauri-action step. macos_mode='skip' is
    # currently a no-op — the macOS runner always boots when the workflow
    # is dispatched. Re-introduce skip semantics if cost becomes a concern.
    steps:
      - name: Checkout papercusp-desktop (this repo)
        uses: actions/checkout@v4

      - name: Checkout papercupai/papercup (sibling for apps/operator UI source)
        uses: actions/checkout@v4
        with:
          repository: papercupai/papercup
          path: _external/papercup
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout papercupai/papercusp (sibling for harness + mcp + pglite)
        uses: actions/checkout@v4
        with:
          repository: papercupai/papercusp
          path: _external/papercusp
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Set up Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && (github.event_name == 'workflow_dispatch' && inputs.macos_mode == 'arm-only' && 'aarch64-apple-darwin' || 'aarch64-apple-darwin,x86_64-apple-darwin') || '' }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Linux build deps
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            rpm

      - name: Install workspace deps (this repo)
        run: npm install --legacy-peer-deps

      - name: Install papercup operator deps
        working-directory: _external/papercup
        run: npm install --legacy-peer-deps

      - name: Install papercusp packages deps
        working-directory: _external/papercusp
        run: npm install --legacy-peer-deps

      - name: Build sidecar (Next.js standalone via build-desktop-sidecar.sh)
        env:
          PAPERCUP_ROOT: ${{ github.workspace }}/_external/papercup
          PAPERCUSP_ROOT: ${{ github.workspace }}/_external/papercusp
        run: bash bin/build-desktop-sidecar.sh

      - name: Build + bundle desktop app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # No projectPath — src-tauri/ lives at repo root in this multi-repo layout.
          tagName: ${{ github.ref_name }}
          releaseName: 'Papercusp Desktop ${{ github.ref_name }}'
          releaseBody: |
            Auto-built from ${{ github.sha }}.
            Unsigned — see install instructions in the description.
          releaseDraft: true
          prerelease: false
          args: ${{ (matrix.platform == 'macos-latest' && github.event_name == 'workflow_dispatch' && inputs.macos_mode == 'arm-only') && '--target aarch64-apple-darwin' || matrix.args }}

      # Linux post-build smoke: install the .deb, launch the binary briefly
      # under xvfb, confirm sidecar comes up. Skips ARM64 because we can't
      # run aarch64 binaries on the x86 runner.
      - name: Linux post-build smoke
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          set -e
          DEB=$(find src-tauri/target/release/bundle/deb -name 'Papercusp_*_amd64.deb' | head -1)
          if [[ -z "$DEB" ]]; then
            echo "ERROR: no .deb produced; nothing to smoke-test"
            exit 1
          fi
          echo "→ smoke-testing $DEB"
          sudo apt-get install -y "$DEB" || sudo dpkg -i "$DEB" || true
          sudo apt-get install -y -f
          sudo apt-get install -y xvfb curl

          xvfb-run -a /usr/bin/papercusp-desktop > /tmp/papercusp.log 2>&1 &
          PID=$!
          for i in {1..180}; do
            if grep -q "sidecar ready on :" /tmp/papercusp.log 2>/dev/null; then
              break
            fi
            sleep 0.5
          done
          if ! grep -q "sidecar ready on :" /tmp/papercusp.log; then
            echo "✗ Sidecar did not become ready in 90s. Full log:"
            cat /tmp/papercusp.log
            echo "---"
            echo "papercusp dirs in HOME:"
            ls -la $HOME/.papercusp/ 2>&1 || true
            kill $PID 2>/dev/null || true
            exit 1
          fi
          PORT=$(grep -oE 'sidecar ready on :[0-9]+' /tmp/papercusp.log | grep -oE '[0-9]+' | head -1)
          echo "✓ Sidecar reachable on port $PORT"

          if ! curl -sfm 5 "http://localhost:$PORT/api/desktop/preflight" | head -c 1000 | tee /tmp/preflight.json; then
            echo
            echo "✗ Preflight endpoint did not respond"
            tail -50 /tmp/papercusp.log
            kill $PID 2>/dev/null || true
            exit 1
          fi
          echo
          if ! grep -q '"ok"' /tmp/preflight.json; then
            echo "✗ Preflight response missing 'ok' field"
            cat /tmp/preflight.json
            kill $PID 2>/dev/null || true
            exit 1
          fi
          echo "✓ Preflight responds with valid JSON"
          kill $PID 2>/dev/null || true
          echo "✓ Linux post-build smoke passed"
