name: AppImage debug (Linux x64)

# Manual-only diagnostic workflow that bypasses tauri-action and calls
# `cargo tauri build --bundles appimage` directly. tauri-action swallows
# linuxdeploy's stderr; this lets it surface so we can actually see why
# the bundling step aborts ~15s in inside the GitHub-hosted runner.
#
# Does NOT publish a release. Does NOT touch the production release
# workflow. Existence is purely to capture stderr in workflow logs.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    name: AppImage (Linux x64) — diagnostic
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout papercusp-desktop
        uses: actions/checkout@v4

      - name: Checkout sibling papercup (workspace deps need submodules)
        uses: actions/checkout@v4
        with:
          repository: papercupai/papercup
          path: _external/papercup
          token: ${{ secrets.SIBLING_REPO_PAT }}
          # Don't recurse via the action; one of the submodules
          # (libs/papercusp) currently points at a SHA not on remote
          # (paperclip-active divergence), which would fail. We need the
          # OTHER submodules though — npm install resolves workspace
          # deps like @restart/papercup-db from libs/papercup-db. Skip
          # auto-recursion, then init only the submodules we need.
          submodules: false

      - name: Init papercup submodules (skip libs/papercusp)
        working-directory: _external/papercup
        env:
          GH_TOKEN: ${{ secrets.SIBLING_REPO_PAT }}
        run: |
          # Auth all github.com submodule clones with our PAT
          git config --global url."https://x-access-token:${GH_TOKEN}@github.com/".insteadOf "https://github.com/"
          # Init every submodule from .gitmodules EXCEPT libs/papercusp
          for path in $(git config --file .gitmodules --get-regexp '^submodule\..*\.path

      - name: Checkout sibling papercusp
        uses: actions/checkout@v4
        with:
          repository: papercupai/papercusp
          path: _external/papercusp
          token: ${{ secrets.SIBLING_REPO_PAT }}
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: appimage-debug-linux-x64

      - name: Install system deps (FUSE + AppImage tooling)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev pkg-config build-essential \
            patchelf libssl-dev rpm libfuse2 fuse

      - name: Install workspace deps
        run: npm install --legacy-peer-deps

      - name: Install operator deps
        working-directory: _external/papercup
        run: npm install --legacy-peer-deps

      - name: Build sidecar
        env:
          PAPERCUP_ROOT: ${{ github.workspace }}/_external/papercup
          PAPERCUSP_ROOT: ${{ github.workspace }}/_external/papercusp
        run: bash bin/build-desktop-sidecar.sh

      - name: Install Tauri CLI
        run: |
          cargo install tauri-cli --version "^2" --locked
          which cargo-tauri
          cargo tauri --version

      # The actual diagnostic step. Build only the AppImage bundle (skipping
      # .deb/.rpm to keep the run focused) with maximum verbosity. Capture
      # both stdout and stderr to a logfile we can also inspect inline.
      - name: Build AppImage with verbose linuxdeploy output
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # linuxdeploy honors DEBUG=1 to log every action.
          DEBUG: "1"
          # Tauri/Rust verbosity.
          RUST_LOG: "debug"
          RUST_BACKTRACE: "1"
        run: |
          set +e
          mkdir -p /tmp/appimage-debug
          cargo tauri build --bundles appimage --verbose 2>&1 | tee /tmp/appimage-debug/build.log
          status=${PIPESTATUS[0]}
          echo "=== cargo tauri build exit status: $status ==="
          echo
          echo "=== last 200 lines of build.log ==="
          tail -200 /tmp/appimage-debug/build.log
          echo
          echo "=== any AppImage artifacts produced? ==="
          find src-tauri/target -name "*.AppImage" -o -name "linuxdeploy*.log" 2>/dev/null | head -20 || true
          exit $status

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appimage-debug-logs
          path: |
            /tmp/appimage-debug/build.log
            src-tauri/target/release/bundle/appimage/**/*.log
          if-no-files-found: ignore
          retention-days: 14
 | awk '{print $2}'); do
            if [[ "$path" == "libs/papercusp" ]]; then
              echo "skipping $path (known divergent SHA, not needed for AppImage build)"
              continue
            fi
            echo "initializing $path"
            git submodule update --init --depth 1 -- "$path"
          done

      - name: Checkout sibling papercusp
        uses: actions/checkout@v4
        with:
          repository: papercupai/papercusp
          path: _external/papercusp
          token: ${{ secrets.SIBLING_REPO_PAT }}
          submodules: recursive

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: appimage-debug-linux-x64

      - name: Install system deps (FUSE + AppImage tooling)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libwebkit2gtk-4.1-dev librsvg2-dev \
            libayatana-appindicator3-dev pkg-config build-essential \
            patchelf libssl-dev rpm libfuse2 fuse

      - name: Install workspace deps
        run: npm install --legacy-peer-deps

      - name: Install operator deps
        working-directory: _external/papercup
        run: npm install --legacy-peer-deps

      - name: Build sidecar
        env:
          PAPERCUP_ROOT: ${{ github.workspace }}/_external/papercup
          PAPERCUSP_ROOT: ${{ github.workspace }}/_external/papercusp
        run: bash bin/build-desktop-sidecar.sh

      - name: Install Tauri CLI
        run: |
          cargo install tauri-cli --version "^2" --locked
          which cargo-tauri
          cargo tauri --version

      # The actual diagnostic step. Build only the AppImage bundle (skipping
      # .deb/.rpm to keep the run focused) with maximum verbosity. Capture
      # both stdout and stderr to a logfile we can also inspect inline.
      - name: Build AppImage with verbose linuxdeploy output
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          # linuxdeploy honors DEBUG=1 to log every action.
          DEBUG: "1"
          # Tauri/Rust verbosity.
          RUST_LOG: "debug"
          RUST_BACKTRACE: "1"
        run: |
          set +e
          mkdir -p /tmp/appimage-debug
          cargo tauri build --bundles appimage --verbose 2>&1 | tee /tmp/appimage-debug/build.log
          status=${PIPESTATUS[0]}
          echo "=== cargo tauri build exit status: $status ==="
          echo
          echo "=== last 200 lines of build.log ==="
          tail -200 /tmp/appimage-debug/build.log
          echo
          echo "=== any AppImage artifacts produced? ==="
          find src-tauri/target -name "*.AppImage" -o -name "linuxdeploy*.log" 2>/dev/null | head -20 || true
          exit $status

      - name: Upload diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: appimage-debug-logs
          path: |
            /tmp/appimage-debug/build.log
            src-tauri/target/release/bundle/appimage/**/*.log
          if-no-files-found: ignore
          retention-days: 14
